# Copy to secret.yaml and fill in real values (do NOT commit the filled version).
#   kubectl -n renfield create secret generic renfield-mcp-filesystem-secrets \
#     --from-literal=RENFIELD_INGEST_TOKEN=... \
#     --from-literal=DOCS_SMB_USER=... \
#     --from-literal=DOCS_SMB_PASS=...
apiVersion: v1
kind: Secret
metadata:
  name: renfield-mcp-filesystem-secrets
  namespace: renfield
type: Opaque
stringData:
  # The folder-ingest Bearer token, minted via
  # POST /api/folder-ingest/token on the Renfield backend (admin).
  RENFIELD_INGEST_TOKEN: "REPLACE_ME"
  # SMB credentials referenced by name from roots.yaml.
  DOCS_SMB_USER: "REPLACE_ME"
  DOCS_SMB_PASS: "REPLACE_ME"
