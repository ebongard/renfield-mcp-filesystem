# Single replica: this is a watcher daemon — two replicas would both watch the
# same shares and double-push. Recreate strategy so a rollout never runs two.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renfield-mcp-filesystem
  namespace: renfield
  labels:
    app: renfield-mcp-filesystem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: renfield-mcp-filesystem
  template:
    metadata:
      labels:
        app: renfield-mcp-filesystem
    spec:
      containers:
        - name: renfield-mcp-filesystem
          image: registry.treehouse.x-idra.de/renfield/filesystem-mcp:v0.1.7
          ports:
            - containerPort: 8080
          env:
            - name: RENFIELD_URL
              value: "http://backend:8000"
            - name: FILES_ROOTS_YAML
              value: "/config/roots.yaml"
            # MCP self-detection: POST this watcher's own failures (SMB-auth, share
            # down, retry-exhausted) to the backend health endpoint so they surface
            # as a proactive admin alert + internal.system_health entry instead of
            # dead-ending in logs. Token = the same folder-ingest push token this
            # deployment already holds (via envFrom), referenced by secretKeyRef
            # because k8s $(VAR) expansion does not reach envFrom-provided vars.
            - name: FILES_NOTIFY_WEBHOOK_URL
              value: "http://backend:8000/api/mcp-health/report"
            - name: FILES_NOTIFY_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: renfield-mcp-filesystem-secrets
                  key: RENFIELD_INGEST_TOKEN
          envFrom:
            - secretRef:
                name: renfield-mcp-filesystem-secrets
          volumeMounts:
            - name: roots
              mountPath: /config
              readOnly: true
      volumes:
        - name: roots
          configMap:
            name: renfield-mcp-filesystem-roots
